[package]
name = "portalo_network"

#使用workspace.package的值
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
#使用workspace.dependencies的依赖

# portalo
portalo_core.workspace = true

# Other
bevy.workspace = true
tokio.workspace = true
anyhow.workspace = true
tempfile = "3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
same-file = "1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
