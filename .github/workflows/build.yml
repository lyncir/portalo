name: Build and Package

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------- 1. Linux 构建 (x86_64) --------------------
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --bin portalo

      - name: Package Linux artifact
        run: |
          mkdir -p dist/portalo-linux-x86_64
          cp target/release/portalo dist/portalo-linux-x86_64/
          cp assets/portalo.desktop dist/portalo-linux-x86_64/ || true
          cp assets/icon.png dist/portalo-linux-x86_64/ || true
          tar -czvf portalo-linux-x86_64.tar.gz -C dist portalo-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: portalo-linux-x86_64
          path: portalo-linux-x86_64.tar.gz
          if-no-files-found: error

  # -------------------- 2. Windows 交叉编译 (x86_64-pc-windows-msvc) --------------------
  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc via cargo-xwin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM & Clang (Required by cargo-xwin)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld zip

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: xwin-windows

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cargo-xwin

      - name: Build Windows binary
        run: cargo xwin build --release --target x86_64-pc-windows-msvc --bin portalo

      - name: Package Windows artifact
        run: |
          mkdir -p dist/portalo-windows-x86_64
          cp target/x86_64-pc-windows-msvc/release/portalo.exe dist/portalo-windows-x86_64/
          cp assets/icon.ico dist/portalo-windows-x86_64/ || true
          cd dist
          zip -r ../portalo-windows-x86_64.zip portalo-windows-x86_64
          cd ..

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: portalo-windows-x86_64
          path: portalo-windows-x86_64.zip
          if-no-files-found: error

  # -------------------- 3. Android 构建 (Debug APK, arm64-v8a) --------------------
  build-android:
    name: Build Android Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$NDK_PATH" ]; then
              echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
              echo "Found Android NDK at $NDK_PATH"
            else
              echo "No pre-installed NDK found in $ANDROID_SDK_ROOT/ndk, installing via sdkmanager..."
              $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
              echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
            fi
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Build Android Rust shared library
        run: |
          cargo ndk -t arm64-v8a -P 26 -o android_app/src/main/jniLibs build --release --package portalo --lib

      - name: Build Android Debug APK
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          cp android_app/build/outputs/apk/debug/Portalo-debug.apk portalo-android-debug.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: portalo-android-debug
          path: portalo-android-debug.apk
          if-no-files-found: error

  # -------------------- 4. 自动发布 Release (仅打 tag 时触发) --------------------
  release:
    name: Publish Release
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/portalo-linux-x86_64/portalo-linux-x86_64.tar.gz
            artifacts/portalo-windows-x86_64/portalo-windows-x86_64.zip
            artifacts/portalo-android-debug/portalo-android-debug.apk
          generate_release_notes: true
