name: Build and Package

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------- 1. Linux 构建与测试 (x86_64) --------------------
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev
          pkg-config --modversion wayland-client

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit and library tests
        run: cargo test --locked --workspace --lib

      - name: Build binary
        run: cargo build --release --locked --bin portalo

      - name: Package Linux artifact
        run: |
          mkdir -p dist/portalo-linux-x86_64
          cp target/release/portalo dist/portalo-linux-x86_64/portalo
          cp assets/portalo.desktop dist/portalo-linux-x86_64/portalo.desktop
          cp assets/icon.png dist/portalo-linux-x86_64/portalo.png
          cp assets/install.sh dist/portalo-linux-x86_64/install.sh
          cp README.rst dist/portalo-linux-x86_64/README.rst
          chmod +x dist/portalo-linux-x86_64/portalo dist/portalo-linux-x86_64/install.sh
          tar -czvf portalo-linux-x86_64.tar.gz -C dist portalo-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: portalo-linux-x86_64
          path: portalo-linux-x86_64.tar.gz
          if-no-files-found: error

  # -------------------- 2. Windows 交叉编译 (x86_64-pc-windows-msvc) --------------------
  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc via cargo-xwin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM & Clang (Required by cargo-xwin)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld zip

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: xwin-windows

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cargo-xwin

      - name: Build Windows binary
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc --bin portalo

      - name: Package Windows artifact
        run: |
          mkdir -p dist/portalo-windows-x86_64
          cp target/x86_64-pc-windows-msvc/release/portalo.exe dist/portalo-windows-x86_64/portalo.exe
          cp assets/icon.ico dist/portalo-windows-x86_64/portalo.ico
          cp README.rst dist/portalo-windows-x86_64/README.rst
          cd dist
          zip -r ../portalo-windows-x86_64.zip portalo-windows-x86_64
          cd ..

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: portalo-windows-x86_64
          path: portalo-windows-x86_64.zip
          if-no-files-found: error

  # -------------------- 3. Android 构建 (Debug APK, arm64-v8a) --------------------
  build-android:
    name: Build Android Debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android Rust shared library
        run: |
          cargo ndk -t arm64-v8a -P 26 -o android_app/src/main/jniLibs build --release --locked --package portalo --lib

      - name: Build Android Debug APK
        working-directory: android_app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: |
          cp android_app/build/outputs/apk/debug/Portalo-debug.apk portalo-android-debug.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: portalo-android-debug
          path: portalo-android-debug.apk
          if-no-files-found: error

  # -------------------- 4. 自动发布 Release (仅打 tag 时触发) --------------------
  release:
    name: Publish Release
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/portalo-linux-x86_64/portalo-linux-x86_64.tar.gz
            artifacts/portalo-windows-x86_64/portalo-windows-x86_64.zip
            artifacts/portalo-android-debug/portalo-android-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
